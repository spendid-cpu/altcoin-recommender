name: watchdog

permissions:
  contents: write   # data/state.db(감시 상태) 커밋용
  actions: write    # scan/track 최근 실행 이력 조회 + 20분 넘게 queued/waiting인 멈춘 실행 취소용

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

# scan.yml/track.yml과 일부러 다른 그룹을 쓴다 — 그 그룹이 막혀도(2026-09-28에 실제로 43시간 막혔던 것처럼)
# 이 감시 장치는 영향받지 않고 계속 돌아야 알림을 보낼 수 있다.
concurrency:
  group: watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: 감시 장치 상태 받기 (state-watchdog 브랜치)
        run: bash scripts/state_sync.sh pull state-watchdog watchdog.db data/watchdog/state.db

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scripts/run_watchdog.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATA_DIR: data/watchdog  # 감시 장치는 자기 상태만 따로 둔다 (scan 상태 파일과 다른 동시성 그룹이라 섞이면 서로 덮어쓴다)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCHDOG_STALE_MINUTES: ${{ vars.WATCHDOG_STALE_MINUTES }}
          WATCHDOG_REMIND_MINUTES: ${{ vars.WATCHDOG_REMIND_MINUTES }}
          WATCHDOG_STUCK_MINUTES: ${{ vars.WATCHDOG_STUCK_MINUTES }}

      - name: 감시 장치 상태 올리기 (state-watchdog 브랜치)
        run: |
          if [ -f data/watchdog/state.db ]; then bash scripts/state_sync.sh push state-watchdog data/watchdog/state.db watchdog.db "state: 감시 장치 상태 갱신"; fi
