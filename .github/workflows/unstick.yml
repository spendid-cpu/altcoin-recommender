name: unstick

# scan/track 실행 하나가 러너를 못 받고 queued로 붙으면(2026-09-28 43시간, 10-03 4시간, 10-06 5.5시간) 같은 동시성 그룹(scan)의
# 뒤 실행이 전부 시작도 못 하고 취소된다. 그 그룹 안에서는 스스로 풀 수 없고, 30분 cron(watchdog)은 GitHub이 몇 시간씩 건너뛰는 일이
# 있어서(10-06에 7시간) 늦다. 그래서 scan/track이 '새로 요청될 때마다'(5분마다) 이 워크플로가 따로 떠서(다른 그룹) 20분 넘게
# 시작 못 한 실행을 취소한다. 진행 중(in_progress)인 실행은 건드리지 않는다.
on:
  workflow_run:
    workflows: [scan, track]
    types: [requested]
  workflow_dispatch: {}

permissions:
  actions: write   # 멈춘 실행 취소
  contents: read

concurrency:
  group: unstick
  cancel-in-progress: false

jobs:
  unstick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 20분 넘게 시작 못 한 scan/track 실행 취소
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          STUCK_MINUTES: ${{ vars.WATCHDOG_STUCK_MINUTES || '20' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cutoff=$(date -u -d "-${STUCK_MINUTES} minutes" +%Y-%m-%dT%H:%M:%SZ)
          echo "기준 시각(이보다 먼저 만들어진 queued/waiting 실행을 취소): $cutoff"
          cancelled=""
          for wf in scan.yml track.yml; do
            for st in queued waiting; do
              ids=$(gh run list --workflow "$wf" --status "$st" --limit 50 --json databaseId,createdAt \
                --jq ".[] | select(.createdAt < \"$cutoff\") | .databaseId") || ids=""
              for id in $ids; do
                echo "멈춘 실행: $wf $id ($st) -> 취소"
                if gh run cancel "$id"; then cancelled="$cancelled ${wf%.yml}:$id($st)"; fi
              done
            done
          done
          if [ -z "$cancelled" ]; then
            echo "멈춘 실행 없음"
          elif [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -m 15 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=🛠 ${STUCK_MINUTES}분 넘게 시작 못 한 실행을 자동으로 취소했어요:${cancelled}. 대기 중이던 다음 스캔·추적이 이어서 돌아요." > /dev/null || true
          fi
