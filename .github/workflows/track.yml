name: track

permissions:
  contents: write  # data/state.db 변경사항을 다시 커밋+푸시하려면 필요
  pages: write     # 대시보드를 GitHub Pages에 배포
  id-token: write  # Pages 배포 인증

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

# scan.yml과 같은 그룹을 써서 동시에 안 돈다 (둘 다 data/state.db를 커밋하고 Pages를 배포하므로 겹치면 충돌한다).
# 대기하다 시작된 실행이 밀려도 큰 문제는 없다 — 다음 실행이 5분 뒤에 또 온다.
concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scripts/run_track.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_INTERVAL_HOURS: ${{ vars.REPORT_INTERVAL_HOURS }}
          EXIT_TAKE_PROFIT_PCT: ${{ vars.EXIT_TAKE_PROFIT_PCT }}
          EXIT_STOP_LOSS_PCT: ${{ vars.EXIT_STOP_LOSS_PCT }}
          EXIT_TRAIL_ARM_PCT: ${{ vars.EXIT_TRAIL_ARM_PCT }}
          EXIT_TRAIL_DD_PCT: ${{ vars.EXIT_TRAIL_DD_PCT }}
          BTC_HOLD_DAYS: ${{ vars.BTC_HOLD_DAYS }}
          MACRO_BRIEFING_HOUR: ${{ vars.MACRO_BRIEFING_HOUR }}
          MACRO_REFRESH_MINUTES: ${{ vars.MACRO_REFRESH_MINUTES }}

      - name: 상태 파일(data/state.db) 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.db
          git diff --staged --quiet || git commit -m "state: 추적 상태 갱신 [skip ci]"
          git pull --rebase origin master
          git push

      - name: 대시보드 데이터 생성
        run: python scripts/export_dashboard.py

      - name: 대시보드 데이터 암호화 (로그인)
        run: python scripts/encrypt_dashboard.py
        env:
          DASHBOARD_USERS: ${{ secrets.DASHBOARD_USERS }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - id: deployment
        uses: actions/deploy-pages@v4
