name: track

permissions:
  contents: write  # data/state.db 변경사항을 다시 커밋+푸시하려면 필요
  pages: write     # 대시보드를 GitHub Pages에 배포
  id-token: write  # Pages 배포 인증

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

# scan.yml과 같은 그룹을 써서 동시에 안 돈다 (둘 다 data/state.db를 커밋하고 Pages를 배포하므로 겹치면 충돌한다).
# 대기하다 시작된 실행이 밀려도 큰 문제는 없다 — 다음 실행이 5분 뒤에 또 온다.
concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # 저장소 변수(Settings > Variables)로 바꿀 수 있는 설정 전부를 모든 단계(스캔·추적·대시보드 생성)에 넘긴다 — 빈 값이면 src/config.py 기본값
    env:
      BTC_EXIT_ENABLED: ${{ vars.BTC_EXIT_ENABLED }}
      BTC_FILTER_MODE: ${{ vars.BTC_FILTER_MODE }}
      BTC_HOLD_DAYS: ${{ vars.BTC_HOLD_DAYS }}
      BTC_WAVE_GATE: ${{ vars.BTC_WAVE_GATE }}
      CYCLE_LOOKBACK_DAYS: ${{ vars.CYCLE_LOOKBACK_DAYS }}
      DAY_GOLDEN_OVERSOLD_LOOKBACK: ${{ vars.DAY_GOLDEN_OVERSOLD_LOOKBACK }}
      DIRECTION_FILTER_ENABLED: ${{ vars.DIRECTION_FILTER_ENABLED }}
      EXIT_STOP_LOSS_PCT: ${{ vars.EXIT_STOP_LOSS_PCT }}
      EXIT_TAKE_PROFIT_PCT: ${{ vars.EXIT_TAKE_PROFIT_PCT }}
      EXIT_TRAIL_ARM_PCT: ${{ vars.EXIT_TRAIL_ARM_PCT }}
      EXIT_TRAIL_DD_PCT: ${{ vars.EXIT_TRAIL_DD_PCT }}
      HEARTBEAT: ${{ vars.HEARTBEAT }}
      HIGH_ZONE_MIN_GAIN_PCT: ${{ vars.HIGH_ZONE_MIN_GAIN_PCT }}
      LOW_CONFIRM_MODE: ${{ vars.LOW_CONFIRM_MODE }}
      LOW_CONFIRM_REQUIRED: ${{ vars.LOW_CONFIRM_REQUIRED }}
      MACRO_BRIEFING_HOUR: ${{ vars.MACRO_BRIEFING_HOUR }}
      MACRO_REFRESH_MINUTES: ${{ vars.MACRO_REFRESH_MINUTES }}
      MA_CONFLUENCE_FILTER_ENABLED: ${{ vars.MA_CONFLUENCE_FILTER_ENABLED }}
      MA_CONFLUENCE_MAX_GAP_PCT: ${{ vars.MA_CONFLUENCE_MAX_GAP_PCT }}
      MIN_RECOMMEND_SCORE: ${{ vars.MIN_RECOMMEND_SCORE }}
      NEW_LISTING_MIN_DAYS: ${{ vars.NEW_LISTING_MIN_DAYS }}
      PAPER_LIMIT_ENABLED: ${{ vars.PAPER_LIMIT_ENABLED }}
      REPORT_FULL_INTERVAL_HOURS: ${{ vars.REPORT_FULL_INTERVAL_HOURS }}
      REPORT_INTERVAL_HOURS: ${{ vars.REPORT_INTERVAL_HOURS }}
      REPORT_MOVE_PCT: ${{ vars.REPORT_MOVE_PCT }}
      RUNUP_FILTER_ENABLED: ${{ vars.RUNUP_FILTER_ENABLED }}
      RUNUP_LOOKBACK_HOURS: ${{ vars.RUNUP_LOOKBACK_HOURS }}
      RUNUP_MAX_PCT: ${{ vars.RUNUP_MAX_PCT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scripts/run_track.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_INTERVAL_HOURS: ${{ vars.REPORT_INTERVAL_HOURS }}
          EXIT_TAKE_PROFIT_PCT: ${{ vars.EXIT_TAKE_PROFIT_PCT }}
          EXIT_STOP_LOSS_PCT: ${{ vars.EXIT_STOP_LOSS_PCT }}
          EXIT_TRAIL_ARM_PCT: ${{ vars.EXIT_TRAIL_ARM_PCT }}
          EXIT_TRAIL_DD_PCT: ${{ vars.EXIT_TRAIL_DD_PCT }}
          BTC_HOLD_DAYS: ${{ vars.BTC_HOLD_DAYS }}
          BTC_FILTER_MODE: ${{ vars.BTC_FILTER_MODE }}
          DAY_GOLDEN_OVERSOLD_LOOKBACK: ${{ vars.DAY_GOLDEN_OVERSOLD_LOOKBACK }}
          HIGH_ZONE_MIN_GAIN_PCT: ${{ vars.HIGH_ZONE_MIN_GAIN_PCT }}
          MACRO_BRIEFING_HOUR: ${{ vars.MACRO_BRIEFING_HOUR }}
          MACRO_REFRESH_MINUTES: ${{ vars.MACRO_REFRESH_MINUTES }}

      - name: 상태 파일(data/state.db) 변경사항 커밋
        run: |
          bash scripts/push_state.sh "state: 추적 상태 갱신 [skip ci]"

      - name: 대시보드 데이터 생성
        run: python scripts/export_dashboard.py

      - name: 대시보드 데이터 암호화 (로그인)
        run: python scripts/encrypt_dashboard.py
        env:
          DASHBOARD_USERS: ${{ secrets.DASHBOARD_USERS }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - id: deployment
        uses: actions/deploy-pages@v4
