name: scan

permissions:
  contents: write  # data/state.db 변경사항을 다시 커밋+푸시하려면 필요
  pages: write     # 대시보드를 GitHub Pages에 배포
  id-token: write  # Pages 배포 인증

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scripts/run_scan.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEARTBEAT: ${{ vars.HEARTBEAT }}
          REPORT_INTERVAL_HOURS: ${{ vars.REPORT_INTERVAL_HOURS }}

      # 상태 저장을 대시보드보다 먼저 한다 — 대시보드 쪽 문제로 중복 알림 방지 상태가 유실되면 안 된다
      - name: 상태 파일(data/state.db) 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.db
          git diff --staged --quiet || git commit -m "state: 스캔 상태 갱신 [skip ci]"
          git pull --rebase origin master
          git push

      - name: 대시보드 데이터 생성
        run: python scripts/export_dashboard.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - id: deployment
        uses: actions/deploy-pages@v4
